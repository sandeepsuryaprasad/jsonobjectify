[build-system]
requires = ["uv_build>=0.9.13,<0.12.0"]
build-backend = "uv_build"

[project]
name = "jsonobjectify"
version = "0.1.0"
description = "A lightweight Python library for converting JSON data into Python objects, simplifying access to nested structures through intuitive dot notation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords =["json-parsing", "dot notation", "automated-json-parsing"]
authors = [
    {name= "Sandeep Suryaprasad"}
]
dependencies = []

[tool.uv.build-backend]
module-root = "src"
module-name = "jsonobjectify"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers, Quality Assurance, Automated Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/sandeepsuryaprasad/jsonobjectify"
Repository = "https://github.com/sandeepsuryaprasad/jsonobjectify"
Issues = "https://github.com/sandeepsuryaprasad/jsonobjectify/issues"

[dependency-groups]
test = ["pytest==8.2.2"]
lint = ["ruff==0.11.12"]

[tool.ruff]
line-length = 119
exclude = [
    "tests",
    "sitepackages",
    ".git",
    ".github",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    ".pytest_cache",
    ".tox",
    ".vscode",
    ".ruff_cache",
    ".mypy_cache",
    ".nox",
    ".eggs"
    ]

[tool.ruff.lint]
select = [
   "F",
   "N",
   "E9",      # Checks for common syntax errors, indendation errors
   "I",
   "E501",    # Checks for lines that exceed the specified maximum character length.
   "RUF022",
   "TID252",
   "F841",    # Checks for the presence of unused variables in function scopes.
   "N816",    # Checks for global variable names that follow the mixedCase convention.
   "B007",    # Checks for unused variables in loops (e.g., for and while statements).
   "D403",    # Checks for docstrings that do not start with a capital letter.
   "D101",
   "D102",    # Checks for undocumented public method definitions.
   "D103",    # Checks for undocumented public function definitions.
   "D106",    # Checks for undocumented public class definitions, for nested classes.
   "D201",    # Checks for docstrings on functions that are separated by one or more blank lines from the function definition.
   "D202",    # Checks for docstrings on functions that are separated by one or more blank lines from the function body.
   "D204",    # Checks for class methods that are not separated from the class's docstring by a blank line.
   "D300",    # Checks for docstrings that use '''triple single quotes''' instead of """triple double quotes""".
   "D404",    # Checks for docstrings that start with This.
   "D405",    # Checks for section headers in docstrings that do not begin with capital letters.
   "D419",    # Checks for empty docstrings.
   "E402",    # Checks for imports that are not at the top of the file.
   "E401",    # Check for multiple imports on one line.
   "E711",    # Checks for comparisons to None which are not using the is operator.
   "E712",    # Checks for equality comparisons to boolean literals.
   "E721",    # Checks for object type comparisons using == and other comparison operators.
   "E722",    # Checks for bare except catches in try-except statements.
   "E731",    # Checks for lambda expressions which are assigned to a variable.
]

ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in `__init__`
    "D212", # Multi-line docstring summary should start at the first line
    "D415"  # Ignore if the doc string does not end with any punctuation
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["./tests"]